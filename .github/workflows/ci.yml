# .github/workflows/ci.yml
# =============================================================================
# SSTRACKER NEXUS COMMAND: MASTER CI/CD & SWARM ORCHESTRATION PIPELINE (v2.0)
# =============================================================================
# Automatically executes validation checks, runs test suites, and spawns the
# autonomous 16-agent debugging swarm to fix any compilation or test failures.
# =============================================================================

name: Master CI & Swarm Autopilot

on:
  push:
    branches: [ master, main, dev, 'release/*' ]
  pull_request:
    branches: [ master, main, dev ]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  validate-and-test:
    name: 🛡️ Code Validation & Verification Suite
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Clone Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🚀 Install pnpm Package Manager
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: 📦 Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: 📥 Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔍 Svelte & TypeScript Code Check
        run: pnpm run check

      - name: 🔒 Run Auth Regression Master Suite
        run: pnpm run test:regression:auth

      - name: ⚡ Run Vitest Unit & Integration Suites
        run: pnpm run test:unit

  notify-on-failure:
    name: 🚨 Report Pipeline Failure
    needs: validate-and-test
    if: failure() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: 📋 Failure Log
        run: echo "CI pipeline verification failed on branch ${{ github.head_ref }}. Pre-commit auth regression and build gates must pass."
