
name: Standard Playwright Sharding & Firebase Deployment

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]

jobs:
  # --- STAGE 1: SHARDED VISUAL & E2E INSPECTION ---
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1-4] # Splits tests across 4 machines for maximum speed [cite: 1156]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci [cite: 1156]
      - name: Install Playwright Browsers & OS Dependencies
        run: npx playwright install --with-deps [cite: 598, 1156]
      - name: Run Playwright tests
        run: npx playwright test --shard=${{ matrix.shard }}/4 [cite: 837, 1156]
        env:
          CI: true
      - name: Upload blob report to GitHub Actions Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report [cite: 1156]
          retention-days: 1

  # --- STAGE 2: REPORT MERGING ---
  merge-reports:
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true [cite: 838, 1156]
      - name: Merge into HTML Report
        run: npx playwright merge-reports --reporter html ./all-blob-reports [cite: 838, 1156]
      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: playwright-report
          retention-days: 14 [cite: 838, 1156]

  # --- STAGE 3: FIREBASE APP HOSTING DEPLOYMENT ---
  deploy-to-firebase:
    # Strict Gate: Only deploy to Firebase if tests passed and we are on the dev branch
    if: github.ref == 'refs/heads/dev' && success()
    needs: [merge-reports]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: 
          node-version: '20'
      - name: Install Firebase CLI
        run: npm install -g firebase-tools [cite: 24]
      - name: Deploy to Firebase App Hosting
        run: firebase deploy --only apphosting --non-interactive [cite: 24, 25]
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}